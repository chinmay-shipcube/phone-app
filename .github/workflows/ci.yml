name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: celldecor
          POSTGRES_PASSWORD: celldecor
          POSTGRES_DB: celldecor_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U celldecor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://celldecor:celldecor@127.0.0.1:5432/celldecor_test
      - run: npm run build
